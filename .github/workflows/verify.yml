name: Build and complete test suite
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify runner safety and result accounting
        run: node --test tools/testing/*.test.mjs
      - name: Verify build and every PHP and browser test
        run: node tools/check.mjs fresh
      - name: Retain verification and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-results
          path: storage/testing/runs/
          if-no-files-found: warn
          retention-days: 14
