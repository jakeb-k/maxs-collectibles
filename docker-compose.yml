name: maxs-test
services:
  mysql:
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    hostname: maxs-test-mysql
    environment:
      MYSQL_DATABASE: maxs_test
      MYSQL_USER: maxs_test
      MYSQL_PASSWORD: maxs-isolated-password
      MYSQL_ROOT_PASSWORD: maxs-isolated-root-only
    ports:
      - "127.0.0.1:13307:3306"
    volumes:
      - ./.cache/mysql:/var/lib/mysql
      - ./tools/testing/init.sql:/docker-entrypoint-initdb.d/guard.sql:ro
    networks: [isolated]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, localhost, -pmaxs-isolated-root-only]
      interval: 2s
      timeout: 2s
      retries: 60
  php:
    image: maxs-test-php:8.4
    build:
      context: .
      dockerfile: tools/testing/Dockerfile
    working_dir: /app
    env_file: ./.cache/current.env
    volumes: [".:/app"]
    networks: [isolated]
networks:
  isolated:
    driver: bridge
